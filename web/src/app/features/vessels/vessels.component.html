<div class="header">
  <h1>Vessels</h1>
  <button mat-flat-button color="primary" (click)="add()">
    <mat-icon>add</mat-icon>
    Add vessel
  </button>
</div>

<mat-form-field appearance="outline" class="search">
  <mat-label>Search name or IMO number</mat-label>
  <input matInput [formControl]="search" autocomplete="off" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

<div class="table-wrapper mat-elevation-z1">
  <table mat-table [dataSource]="vessels" [trackBy]="trackById">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="imo">
      <th mat-header-cell *matHeaderCellDef>IMO number</th>
      <td mat-cell *matCellDef="let row" class="mono">{{ row.imoNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions"></th>
      <td mat-cell *matCellDef="let row" class="actions">
        <button mat-icon-button matTooltip="Edit" aria-label="Edit vessel" (click)="edit(row)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button matTooltip="Delete" aria-label="Delete vessel" (click)="remove(row)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty" [attr.colspan]="columns.length">{{ loading ? 'Loading…' : 'No vessels found.' }}</td>
    </tr>
  </table>
</div>
