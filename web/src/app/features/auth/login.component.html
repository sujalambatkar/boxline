<mat-card class="card">
  <mat-card-header>
    <mat-card-title>Sign in to BoxLine</mat-card-title>
    <mat-card-subtitle>Container shipping operations</mat-card-subtitle>
  </mat-card-header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <mat-card-content class="fields">
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" cdkFocusInitial />
        <mat-error *ngIf="form.controls.email.hasError('required')">E-mail is required.</mat-error>
        <mat-error *ngIf="form.controls.email.hasError('email')">Enter a valid e-mail address.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
          <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error>Password is required.</mat-error>
      </mat-form-field>

      <p class="error" *ngIf="error" role="alert">{{ error }}</p>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </mat-card-actions>
  </form>
</mat-card>
